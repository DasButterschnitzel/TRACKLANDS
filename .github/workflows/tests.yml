name: tests

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Save pipeline (unit)
        run: node tests/run.mjs unit
      - name: Railway scenarios + regression seeds
        run: node tests/run.mjs rail seeds
      - name: Production save, economy balance, persistence, import, offline PWA, tutorial
        run: node tests/run.mjs prodsave economy persist import pwa tutorial build finance authority towns crossings roads audio industry weather news stationtypes transport mapsize company scenarios rivals touch buses overview traffic cities chains
      - name: Save fuzz, monkey, UI layout (quick)
        run: node tests/run.mjs savefuzz monkey ui --quick
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: tests/output
          if-no-files-found: ignore
