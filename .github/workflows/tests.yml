# Fast gate: every push. Cheap checks first, so a broken build fails in
# about a minute instead of after the long suites.
#   1. static   — service worker current, modules parse, imports resolve, JSON valid
#   2. suites   — the functional regression in parallel groups, plus 150 save-fuzz
#                 cases and the failure corpus (tests/fuzz-corpus.json)
#   3. browsers — the cross-browser smoke in Chromium, Firefox and WebKit
#   4. i18n-review — optional semantic translation review, report only (never
#                 blocks, never edits); NOT EXECUTED without the CI secrets
# The deeper tiers (integration, release, nightly) are in deep.yml.
name: tests

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static check (service worker, syntax, imports, JSON)
        run: node tools/check.mjs

  suites:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        group:
          - name: core
            suites: unit worldgen rail seeds network urban roadtypes tools helpui packs terrain eras layers metro fourtrack planning stationcomplex erainfra p12risk costquote search catalogsearch localization offline access security
            quick: monkey ui
          - name: economy
            suites: prodsave savesafety music economy standing analysis timectl persist import pwa tutorial build finance authority towns crossings roads audio industry weather news stationtypes
            quick: ''
          - name: transport
            suites: transport trafficperf campaign branding makers terminals fleet competition mapsize company scenarios rivals touch buses overview traffic cities chains rollingstock stress audit
            quick: ''
          - name: fuzz-fast
            suites: savefuzz --cases=150 --corpus
            quick: qa bench ai
    name: suites (${{ matrix.group.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Suites
        if: matrix.group.suites != ''
        run: node tests/run.mjs ${{ matrix.group.suites }}
      - name: Quick suites
        if: matrix.group.quick != ''
        run: node tests/run.mjs ${{ matrix.group.quick }} --quick
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.group.name }}
          path: tests/output
          if-no-files-found: ignore

  browsers:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    name: browsers (${{ matrix.engine }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps ${{ matrix.engine }}
      - name: Cross-browser smoke
        env:
          BROWSER: ${{ matrix.engine }}
        # Firefox gets WebGL only with a display
        run: ${{ matrix.engine == 'firefox' && 'xvfb-run -a ' || '' }}node tests/run.mjs xbrowser hardening terrain eras erainfra p12risk search catalogsearch access

  i18n-review:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # report only: a finding never fails the build and nothing is edited
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: .cache/i18n-review
          key: i18n-review-${{ hashFiles('src/i18n.js', 'src/i18n_rail.js', 'tests/fixtures/i18n-calibration.json') }}
          restore-keys: i18n-review-
      - name: Semantic translation review (key, English, German only)
        env:
          # CI secrets only; absent → "NOT EXECUTED: LANGUAGE SEMANTIC REVIEW NOT CONFIGURED"
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          TYPESAFE_API_URL: ${{ secrets.TYPESAFE_API_URL }}
        run: node tools/i18n-review.mjs --out tests/output/i18n-review.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i18n-review
          path: tests/output/i18n-review.json
          if-no-files-found: ignore
