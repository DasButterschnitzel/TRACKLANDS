[package]
name = "tracklands"
version = "6.1.1"
description = "TRACKLANDS native shell (Tauri 2): hosts the unchanged web game"
authors = ["TRACKLANDS"]
license = "UNLICENSED"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
name = "tracklands_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
tauri-plugin-dialog = "=2.8.1"
tauri-plugin-fs = "=2.6.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
